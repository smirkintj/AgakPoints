name: CI

on:
  push:
    branches: ["**"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest

    env:
      # Build-time placeholders. No migration runs and nothing connects to a
      # database here — `next build` only needs these to exist so module-level
      # config reads don't throw during page collection.
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
      AUTH_SECRET: ci-placeholder-auth-secret
      PARTYKIT_SECRET: 0123456789abcdef0123456789abcdef
      SECRET_KEY: "0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef"
      NEXT_PUBLIC_PARTYKIT_HOST: localhost:1999

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # `npm ci` runs the postinstall prisma generate, so the client exists
      # before anything typechecks against it.
      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      # Deliberately not `npm run build` — that script runs `prisma migrate
      # deploy` first, which would need a real database.
      - name: Build
        run: npx next build
